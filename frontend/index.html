<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP</title>
  </head>
  <body>
    <!-- Filled in by erp/www/erp.py when served at /erp. Under `npm run dev` this stays the
         literal placeholder, which frappe-js-sdk detects and skips sending a CSRF header for. -->
    <script>
      window.csrf_token = '{{ csrf_token }}'
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
